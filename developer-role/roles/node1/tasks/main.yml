---
# tasks file for node1
#001
- name: Install httpd
  ansible.builtin.yum:
    name: httpd
    state: present

- name: Ensure the default Apache port is 80
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf/httpd.conf
    regexp: '^Listen '
    insertafter: '^#Listen '
    line: Listen 80

- name: Enable service httpd, and not touch the state
  ansible.builtin.service:
    name: httpd
    enabled: yes

- name: Start service httpd, if not started
  ansible.builtin.service:
    name: httpd
    state: started

######################
- name: Install zabbix repository
  ansible.builtin.yum:
    name: https://repo.zabbix.com/zabbix/6.4/rhel/9/x86_64/zabbix-release-latest.el9.noarch.rpm
    state: present
    disable_gpg_check: true

- name: Install zabbix-agent
  ansible.builtin.yum:
    name: zabbix-agent
    state: present

- name: Configure zabbix agent
  ansible.builtin.copy:
    src: files/zabbix_agentd.conf
    dest: /etc/zabbix/zabbix_agentd.conf
    owner: root
    group: root
    mode: '0644' # Corrected mode for a config file

- name: Enable service zabbix-agent, and not touch the state
  ansible.builtin.service:
    name: zabbix-agent
    enabled: yes

- name: Start service zabbix-agent, if not started
  ansible.builtin.service:
    name: zabbix-agent
    state: started

- name: Copy ssh private key for ec2-user
  ansible.builtin.copy:
    src: files/id_rsa
    dest: /home/ec2-user/.ssh/id_rsa
    owner: ec2-user
    group: ec2-user
    mode: '0600'
  become: false

- name: Copy ssh public key for ec2-user
  ansible.builtin.copy:
    src: files/id_rsa.pub
    dest: /home/ec2-user/.ssh/id_rsa.pub
    owner: ec2-user
    group: ec2-user
    mode: '0644' # Corrected mode for a public key
  become: false

- name: Copy ssh private key for root
  ansible.builtin.copy:
    src: files/id_rsa
    dest: /root/.ssh/id_rsa
    owner: root
    group: root
    mode: '0600'

- name: Copy ssh public key for root
  ansible.builtin.copy:
    src: files/id_rsa.pub
    dest: /root/.ssh/id_rsa.pub
    owner: root
    group: root
    mode: '0644'

######################

- name: Install utility packages
  ansible.builtin.yum:
    name: 
      # Conflicting packages have been removed from this list
      - socat.x86_64
      - wireshark.x86_64
      - tcpdump.x86_64
    state: present


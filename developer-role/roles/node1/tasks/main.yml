- name: Create lab directories
  ansible.builtin.file:
    path: "/home/ec2-user/{{ item }}"
    state: directory
    mode: '0755'
    owner: ec2-user
    group: ec2-user
  loop:
    - 01-lab
    - 02-lab
    - 03-lab
    - 04-lab
    - 05-lab

- name: Copy lab files for 01-lab
  ansible.builtin.copy:
    src: "files/01-lab/{{ item }}"
    dest: "/home/ec2-user/01-lab/{{ item }}"
    owner: ec2-user
    group: ec2-user
    mode: '0644'
  loop:
    - hello-rh1.yml
    - webhook-example.yml
    - inventory.yml

- name: Copy lab files for 02-lab
  ansible.builtin.copy:
    src: "files/02-lab/{{ item }}"
    dest: "/home/ec2-user/02-lab/{{ item }}"
    owner: ec2-user
    group: ec2-user
    mode: '0644'
  loop:
    - hello-rh1.yml
    - webhook-example.yml
    - inventory.yml

- name: Copy and unarchive lab files for 03-lab
  ansible.builtin.unarchive:
    src: files/03-lab/rh1-eda-example.tar.xz
    dest: /home/ec2-user/03-lab/
    owner: ec2-user
    group: ec2-user
    remote_src: no

- name: Create rulebooks directory for 04-lab
  ansible.builtin.file:
    path: /home/ec2-user/04-lab/rulebooks
    state: directory
    mode: '0755'
    owner: ec2-user
    group: ec2-user

- name: Copy webhook file for 04-lab
  ansible.builtin.copy:
    src: files/04-lab/webhook-debug.yml 
    dest: /home/ec2-user/04-lab/rulebooks/webhook-debug.yml 
    owner: ec2-user
    group: ec2-user
    mode: '0644'

- name: Create directories for 05-lab
  ansible.builtin.file:
    path: "/home/ec2-user/05-lab/{{ item }}"
    state: directory
    mode: '0755'
    owner: ec2-user
    group: ec2-user
  loop:
    - rulebooks
    - project-http

- name: Copy rulebook file for 05-lab
  ansible.builtin.copy:
    src: files/05-lab/rulebooks/webhook-zabbix.yml
    dest: /home/ec2-user/05-lab/rulebooks/webhook-zabbix.yml
    owner: ec2-user
    group: ec2-user
    mode: '0644'

- name: Copy playbook file for 05-lab
  ansible.builtin.copy:
    src: files/05-lab/project-http/playbook.yml
    dest: /home/ec2-user/05-lab/project-http/playbook.yml
    owner: ec2-user
    group: ec2-user
    mode: '0644'
